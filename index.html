<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

  <header class="header">
    <div class="location">
      <span class="pin">📍</span> Deliver to Nasr City <span class="arrow">▼</span>

  <section class="promo">
    <h2>30% OFF SPECIAL</h2>
    <p>🎟 CODE: ICA30</p>

  <section class="categories">
    <button class="cat-btn">🍔 Food</button>
    <button class="cat-btn">☕ Cafe</button>
    <button class="cat-btn">🛒 Mart</button>
    <button class="cat-btn">💊 Meds</button>

  <section class="restaurant-info">
    <h3>Burger Station <span class="rating">★ 4.8</span></h3>
    <p>20-30 min . Free delivery</p>
  </section>

  <nav class="bottom-nav">
    <a href="#" class="nav-item">🏠 Home</a>
    <a href="#" class="nav-item">🔍 Search</a>
    <a href="#" class="nav-item">🛍 Orders</a>
